<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <title>VALORANT — Team Rankings</title>
    <link rel="icon" href="../assets/media/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            valo: {
              red: '#ff4655', 'red-dark': '#ce323f',
              dark: '#0a0e13', navy: '#0f1923', card: '#141f29',
              border: '#1e2d3d', 'border-light': '#2a3f52',
              text: '#e3dfd9', muted: '#8b978f', dim: '#4a5a65',
            }
          },
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
    </script>
    <link rel="stylesheet" href="../assets/css/navbar.css" />
    <link rel="stylesheet" href="../assets/css/hero.css" />
    <link rel="stylesheet" href="../assets/css/valo.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar"></nav>

<!-- HERO -->
<header>
    <div class="video-container">
        <video autoplay muted loop class="myVideo">
            <source src="../assets/media/agent-background-generic.mp4" type="video/mp4" />
        </video>
        <div class="valo-img-container">
            <img src="../assets/media/agents-group-31d7ce5a3637e45d8b25d2fd03159e6c.png" alt="valo-img" class="valo-img" />
        </div>
        <div class="text-overlay">
            <h1>LEADERBOARDS</h1>
        </div>
    </div>
</header>

<!-- TEAMS BODY -->
<main class="top-players">

    <!-- Search bar -->
    <div class="search-bar">
        <p>SEARCH TEAMS</p>
        <div class="search-container">
            <input type="text" id="nameFilter" placeholder="Team Name">
            <button type="submit" id="searchButton">
                <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                          d="m20 17.5-4.667-4.667A8.382 8.382 0 0 0 16.667 8.333 8.333 8.333 0 1 0 8.333 16.667a8.382 8.382 0 0 0 4.5-1.334L17.5 20l2.5-2.5zM3.333 8.333a5 5 0 1 1 5 5 4.908 4.908 0 0 1-5-5z"
                          fill="currentColor" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Region tabs -->
    <div class="sectionWrapperTeam">
        <button class="regionTeam" value="na">NA</button>
        <button class="regionTeam" value="eu">EU</button>
        <button class="regionTeam" value="ap">AP</button>
        <button class="regionTeam" value="la">LA</button>
        <button class="regionTeam" value="la-s">LA-S</button>
        <button class="regionTeam" value="la-n">LA-N</button>
        <button class="regionTeam" value="oce">OC</button>
        <button class="regionTeam" value="kr">KR</button>
        <button class="regionTeam" value="mn">MN</button>
        <button class="regionTeam" value="br">BR</button>
        <button class="regionTeam" value="cn">CN</button>
    </div>

    <!-- Column headers -->
    <li class="team-info">
        <div class="team-info-rank-container"><h3>#</h3></div>
        <div></div>
        <div class="team-info-name-container"><p>TEAM</p></div>
        <div class="team-info-country-container"><p>REGION</p></div>
        <div class="team-info-earnings-container"><p>EARNINGS</p></div>
        <div class="team-info-record-container"><p>RECORD</p></div>
    </li>

    <!-- Rankings list -->
    <div class="rankingsContainer"></div>

    <!-- Pagination -->
    <div class="pagination">
        <button id="prevPage">← Previous</button>
        <button id="nextPage">Next →</button>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <p><i class="fas fa-copyright"></i> 2023 TEAM DYNAMITE</p>
    <p class="p2">All images, videos, and contents are property of RIOT GAMES</p>
</footer>

<script src="https://unpkg.com/scrollreveal"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/navbar.js"></script>
<script src="../assets/js/leaderboardsTeams.js"></script>
<script src="../assets/js/index.js"></script>
</body>
</html>
