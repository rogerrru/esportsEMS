<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1">
    <title>VALORANT — Latest News</title>
    <link rel="icon" href="../assets/media/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            valo: {
              red: '#ff4655', 'red-dark': '#ce323f',
              dark: '#0a0e13', navy: '#0f1923', card: '#141f29',
              border: '#1e2d3d', 'border-light': '#2a3f52',
              text: '#e3dfd9', muted: '#8b978f', dim: '#4a5a65',
            }
          },
          fontFamily: { sans: ['Poppins', 'sans-serif'] }
        }
      }
    }
    </script>
    <link rel="stylesheet" href="../assets/css/navbar.css" />
    <link rel="stylesheet" href="../assets/css/hero.css" />
    <link rel="stylesheet" href="../assets/css/valo.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar"></nav>

<!-- HERO -->
<header>
    <div class="video-container">
        <video autoplay muted loop class="myVideo">
            <source src="../assets/media/agent-background-generic.mp4" type="video/mp4" />
        </video>
        <div class="valo-img-container">
            <img src="../assets/media/agents-group-31d7ce5a3637e45d8b25d2fd03159e6c.png" alt="valo-img" class="valo-img" />
        </div>
        <div class="text-overlay">
            <p>VALORANT</p>
            <h1>LATEST NEWS</h1>
        </div>
    </div>
</header>

<!-- NEWS BODY -->
<main>
    <div id="news-filter-bar" class="news-filter-bar"></div>
    <div class="news-container"></div>
    <div class="load-more-container"></div>

    <!-- Article detail view -->
    <div id="article-view" class="article-view" hidden>
        <div class="article-nav">
            <button class="article-back-btn" id="article-back-btn">← BACK TO NEWS</button>
            <a id="article-source-link" href="#" target="_blank" class="article-vlr-link">VIEW ON VLR.GG ↗</a>
        </div>
        <p id="article-loading" class="article-loading" hidden>Loading article…</p>
        <div id="article-body"></div>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <p><i class="fas fa-copyright"></i> 2023 TEAM DYNAMITE</p>
    <p class="p2">All images, videos, and contents are property of RIOT GAMES</p>
</footer>

<script src="https://unpkg.com/scrollreveal"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/navbar.js"></script>
<script src="../assets/js/index.js"></script>
<script src="../assets/js/overview.js"></script>
</body>
</html>
