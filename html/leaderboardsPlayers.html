<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1923" />
    <title>VALORANT — Player Leaderboards</title>
    <link rel="icon" href="../assets/media/logo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../assets/css/navbar.css" />
    <link rel="stylesheet" href="../assets/css/hero.css" />
    <link rel="stylesheet" href="../assets/css/valo.css" />
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar"></nav>

<!-- HERO -->
<header>
    <div class="video-container">
        <video autoplay muted loop class="myVideo">
            <source src="../assets/media/agent-background-generic.mp4" type="video/mp4" />
        </video>
        <div class="valo-img-container">
            <img src="../assets/media/agents-group-31d7ce5a3637e45d8b25d2fd03159e6c.png" alt="valo-img" class="valo-img" />
        </div>
        <div class="text-overlay">
            <h1><span>PLAYER</span>LEADERBOARDS</h1>
        </div>
    </div>
</header>

<!-- LEADERBOARD BODY -->
<main class="top-players">

    <!-- Search bar -->
    <div class="search-bar">
        <p>SEARCH LEADERBOARDS</p>
        <div class="search-container">
            <input type="text" id="nameFilter" placeholder="Playername#Tagline">
            <button type="submit" id="searchButton">
                <svg width="20" height="20" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd"
                          d="m20 17.5-4.667-4.667A8.382 8.382 0 0 0 16.667 8.333 8.333 8.333 0 1 0 8.333 16.667a8.382 8.382 0 0 0 4.5-1.334L17.5 20l2.5-2.5zM3.333 8.333a5 5 0 1 1 5 5 4.908 4.908 0 0 1-5-5z"
                          fill="currentColor" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Filters -->
    <div class="sectionWrapper">
        <div class="region">
            <label for="regionSelect">REGION</label>
            <select id="regionSelect">
                <option value="na">NA</option>
                <option value="eu">EU</option>
                <option value="br">BR</option>
                <option value="ap">AP</option>
                <option value="kr">KR</option>
                <option value="latam">LATAM</option>
            </select>
        </div>
        <div class="rank">
            <label for="rankSelect">RANK</label>
            <select id="rankSelect">
                <option value="0">All Ranks</option>
                <option value="27">Radiant</option>
                <option value="26">Immortal 3</option>
                <option value="25">Immortal 2</option>
                <option value="24">Immortal 1</option>
            </select>
        </div>
        <div class="act">
            <label>Season</label>
            <div class="act-current">Current Act</div>
        </div>
    </div>

    <!-- Column headers -->
    <li class="player-info">
        <div class="player-info-rank-container"><h3>#</h3></div>
        <div class="player-info-rating-container"><p class="player-points">RATING</p></div>
        <div><p>PLAYER</p></div>
        <div class="player-info-wins-container"><p>WINS</p></div>
    </li>

    <!-- Rankings list -->
    <div class="rankingsContainer"></div>

    <!-- Pagination -->
    <div class="pagination">
        <button id="prevPage">← Previous</button>
        <button id="nextPage">Next →</button>
    </div>
</main>

<!-- FOOTER -->
<footer>
    <p><i class="fas fa-copyright"></i> 2023 TEAM DYNAMITE</p>
    <p class="p2">All images, videos, and contents are property of RIOT GAMES</p>
</footer>

<script src="https://unpkg.com/scrollreveal"></script>
<script src="../assets/js/config.js"></script>
<script src="../assets/js/navbar.js"></script>
<script src="../assets/js/leaderboardsPlayers.js"></script>
<script src="../assets/js/index.js"></script>
</body>
</html>
